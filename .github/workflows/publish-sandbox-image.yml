name: Publish Sandbox Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Additional image tag to publish, e.g. dev, test, sandbox-20260604'
        required: false
        default: 'dev'
      push_latest:
        description: 'Also publish the latest tag'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lumi-ai-lab/lumi-sandbox

jobs:
  authz-boundary:
    name: Test Pi authorization runtime boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            gotray/go.sum

      - name: Test as publisher
        working-directory: backend
        run: go test ./...

      - name: Test real cross-UID/GID boundary
        working-directory: backend
        run: sudo env "PATH=$PATH" go test -count=1 -v ./internal/agent ./internal/piacpbridge ./internal/requestercontext ./internal/sandbox ./cmd/device-executor

  verify-images:
    name: Verify sandbox image (${{ matrix.arch }})
    needs: authz-boundary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            elf_machine: '62'
          - platform: linux/arm64
            arch: arm64
            elf_machine: '183'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: lumi-sandbox:verify-${{ matrix.arch }}
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.arch }}

      - name: Verify platform image
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: lumi-sandbox:verify-${{ matrix.arch }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          actual_machine="$(docker run --rm --platform "$PLATFORM" --entrypoint sh "$IMAGE" -c 'od -An -tu2 -j18 -N2 /usr/local/bin/device-executor | xargs')"
          test "$actual_machine" = "$ELF_MACHINE"
          docker run --rm --platform "$PLATFORM" "$IMAGE" --help
          test "$(docker run --rm --platform "$PLATFORM" --entrypoint node "$IMAGE" --version)" = "v22.22.2"

  build:
    name: Build and publish sandbox image
    needs: verify-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.push_latest }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
